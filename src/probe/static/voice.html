<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Versa — Voice Tutor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/voice.css" />
</head>
<body>
  <div class="wrap">
    <header class="top">
      <div class="brand">
        <span class="mark"></span>
        <span class="serif">Versa</span>
        <span class="sub">Conversational AI Tutor</span>
        <a href="/" class="text-link">text mode ↗</a>
      </div>
      <div class="head-right">
        <span class="engine-badges" id="engineBadges"></span>
        <div class="learner-pick">
          <button class="learner-btn active" data-learner="demo-learner-a">Student&nbsp;A</button>
          <button class="learner-btn" data-learner="demo-learner-b">Student&nbsp;B</button>
          <button class="reset-btn" id="btnReset" title="new session">↺</button>
        </div>
      </div>
    </header>

    <main class="stage">
      <div class="convo" id="convo">
        <div class="empty-hero">
          <div class="hero-orb"></div>
          <div class="hero-line">Ask Versa anything.</div>
          <div class="hero-sub">Tap the mic and try “Explain recursion.”</div>
        </div>
      </div>

      <div class="options" id="options" hidden></div>

      <div class="dock">
        <div class="interim" id="interim" hidden></div>
        <div class="orb-wrap">
          <button class="orb" id="btnMic" aria-label="Start speaking">
            <span class="orb-ring"></span>
            <span class="orb-core"></span>
            <span class="orb-icon" id="orbIcon">🎙</span>
          </button>
        </div>
        <div class="status-line">
          <span class="status-dot" id="statusDot"></span>
          <span class="status-text" id="statusText">Tap to speak</span>
        </div>
        <form class="typed" id="typedForm">
          <input id="typedInput" placeholder="…or type your question" autocomplete="off" />
          <button type="submit" aria-label="send">Send</button>
        </form>
        <div class="err" id="err" hidden></div>
      </div>
    </main>

    <aside class="side">
      <section class="panel">
        <h3>Learner Memory</h3>
        <div id="memoryList" class="memory-list"><div class="muted">No memory retrieved yet.</div></div>
      </section>
      <section class="panel moss">
        <h3><span class="bolt">⚡</span> Moss Retrieval <span class="hint">retrieval only</span></h3>
        <div id="mossPanel" class="moss-body"><div class="muted">Awaiting first turn…</div></div>
      </section>
    </aside>
  </div>

  <audio id="player" hidden></audio>
  <script src="/static/voice.js"></script>
</body>
</html>
